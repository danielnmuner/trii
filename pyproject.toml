[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trii-ingestion"
version = "0.1.0"
description = "Clipboard text parsing and normalization for Trii market snapshots."
readme = "fixtures/README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2.0",
  "pydantic>=2.8,<3.0",
  "streamlit>=1.57,<2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "diagrams>=0.25.1",
    "pytest>=8.0,<9.0",
]
