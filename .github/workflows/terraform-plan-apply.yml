name: Terraform Plan and Apply

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan-apply.yml"
      - ".github/workflows/terraform-destroy.yml"
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Accion a ejecutar"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enforce main branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "This workflow must run from main because the IAM trust policy is expected to allow the main branch."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::311923415472:role/GitHubTerraformTriiRole
          role-session-name: github-actions-terraform-prod
          allowed-account-ids: 311923415472

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Bootstrap Terraform state bucket
        run: bash infra/scripts/bootstrap-state-bucket.sh

      - name: Terraform init prod
        run: terraform -chdir=infra/prod init -input=false

      - name: Terraform validate prod
        run: terraform -chdir=infra/prod validate -no-color

      - name: Terraform plan prod
        run: |
          terraform -chdir=infra/prod plan -no-color -input=false -out=tfplan
          terraform -chdir=infra/prod show -no-color tfplan > infra/prod/tfplan.txt
          {
            echo "## Terraform plan"
            echo ""
            echo '```text'
            cat infra/prod/tfplan.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          TF_IN_AUTOMATION: "true"
          TF_VAR_api_gateway_shared_token: ${{ secrets.TF_VAR_API_GATEWAY_SHARED_TOKEN }}

      - name: Terraform apply prod
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'apply')
        run: terraform -chdir=infra/prod apply -input=false -auto-approve tfplan
        env:
          TF_IN_AUTOMATION: "true"
          TF_VAR_api_gateway_shared_token: ${{ secrets.TF_VAR_API_GATEWAY_SHARED_TOKEN }}
