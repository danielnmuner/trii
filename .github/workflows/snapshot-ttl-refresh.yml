name: Snapshot TTL Refresh

on:
  workflow_dispatch:
    inputs:
      apply_mode:
        description: "Modo de ejecucion"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
      table_scope:
        description: "Tablas a procesar"
        required: true
        default: all
        type: choice
        options:
          - all
          - current-snapshots
          - session-vectors

permissions:
  contents: read
  id-token: write

concurrency:
  group: snapshot-ttl-refresh-prod
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      apply_mode: ${{ steps.command.outputs.apply_mode }}
      table_scope: ${{ steps.command.outputs.table_scope }}
      tables_json: ${{ steps.command.outputs.tables_json }}
    steps:
      - name: Enforce main branch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "This workflow must run from main because the IAM trust policy is expected to allow the main branch."
            exit 1
          fi

      - name: Resolve command
        id: command
        shell: bash
        env:
          APPLY_MODE: ${{ inputs.apply_mode }}
          TABLE_SCOPE: ${{ inputs.table_scope }}
        run: |
          set -euo pipefail

          declare -a tables
          if [[ "${TABLE_SCOPE}" == "all" ]]; then
            tables+=(
              current-snapshots
              session-vectors
            )
          else
            tables+=("${TABLE_SCOPE}")
          fi

          tables_json="$(printf '%s\n' "${tables[@]}" | jq -R . | jq -sc .)"

          {
            echo "apply_mode=${APPLY_MODE}"
            echo "table_scope=${TABLE_SCOPE}"
            echo "tables_json=${tables_json}"
          } >> "${GITHUB_OUTPUT}"

  refresh:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        table: ${{ fromJson(needs.resolve.outputs.tables_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::311923415472:role/GitHubTerraformTriiRole
          # Keep the default duration unless the IAM role MaxSessionDuration is raised.
          role-session-name: github-actions-snapshot-ttl-refresh-${{ matrix.table }}
          allowed-account-ids: 311923415472

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Execute TTL refresh
        shell: bash
        env:
          APPLY_MODE: ${{ needs.resolve.outputs.apply_mode }}
          TABLE_NAME: ${{ matrix.table }}
        run: |
          set -euo pipefail

          declare -a args
          args+=(--table "${TABLE_NAME}")

          if [[ "${APPLY_MODE}" == "apply" ]]; then
            args+=(--apply)
          fi

          uv run infra/scripts/refresh_snapshot_ttls.py "${args[@]}" | tee "snapshot-ttl-refresh-${TABLE_NAME}.json"

      - name: Publish summary
        shell: bash
        env:
          APPLY_MODE: ${{ needs.resolve.outputs.apply_mode }}
          TABLE_SCOPE: ${{ needs.resolve.outputs.table_scope }}
          TABLE_NAME: ${{ matrix.table }}
        run: |
          case "${TABLE_NAME}" in
            current-snapshots) ttl_target="48h" ;;
            session-vectors) ttl_target="24h" ;;
            *) ttl_target="unknown" ;;
          esac

          {
            echo "## Snapshot TTL refresh"
            echo ""
            echo "- Apply mode: \`${APPLY_MODE}\`"
            echo "- Table scope: \`${TABLE_SCOPE}\`"
            echo "- Table: \`${TABLE_NAME}\`"
            echo "- Target TTL: \`${ttl_target}\`"
            echo ""
            echo "### Result"
            echo '```json'
            cat "snapshot-ttl-refresh-${TABLE_NAME}.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-ttl-refresh-${{ github.run_id }}-${{ matrix.table }}
          path: snapshot-ttl-refresh-${{ matrix.table }}.json
